<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Cyvera | Digital Agency for Branding, SEO, Cybersecurity & Software Development</title>
    <meta name="description" content="Cyvera is your end-to-end digital partner - brand identity, SEO, cybersecurity, website development, and custom software under one roof. Book a free 90-day strategy session." />
    <meta name="keywords" content="digital agency, SEO, cybersecurity, website development, custom software, branding, social media marketing, digital forensics" />
    <meta name="author" content="Cyvera" />
    <link rel="canonical" href="https://cyvera.com.au/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cyvera.com.au/" />
    <meta property="og:title" content="Cyvera | Digital Agency for Branding, SEO, Cybersecurity & Software Development" />
    <meta property="og:description" content="End-to-end digital partner - brand identity, SEO, cybersecurity, website development, and custom software under one roof. Book a free 90-day strategy session." />
    <meta property="og:image" content="https://cyvera.com.au/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Cyvera" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@cyvera" />
    <meta name="twitter:title" content="Cyvera | Digital Agency for Branding, SEO & Cybersecurity" />
    <meta name="twitter:description" content="End-to-end digital partner - brand identity, SEO, cybersecurity, and custom software under one roof." />
    <meta name="twitter:image" content="https://cyvera.com.au/og-image.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://cyvera.com.au/#organization",
          "name": "Cyvera",
          "url": "https://cyvera.com.au",
          "logo": {
            "@type": "ImageObject",
            "url": "https://cyvera.com.au/logo-without-name.png"
          },
          "description": "Cyvera is an end-to-end digital agency specialising in branding, SEO, cybersecurity, website development, and custom software.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "G3/62 Didsbury St",
            "addressLocality": "East Brisbane",
            "addressRegion": "QLD",
            "postalCode": "4169",
            "addressCountry": "AU"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "email": "info@cyvera.com.au"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://cyvera.com.au/#website",
          "url": "https://cyvera.com.au",
          "name": "Cyvera",
          "publisher": { "@id": "https://cyvera.com.au/#organization" }
        },
        {
          "@type": "ProfessionalService",
          "@id": "https://cyvera.com.au/#service",
          "name": "Cyvera Digital Agency",
          "provider": { "@id": "https://cyvera.com.au/#organization" },
          "serviceType": [
            "Social Media Marketing",
            "Search Engine Optimization",
            "Cybersecurity & Digital Forensics",
            "Website Development",
            "Custom Software Development"
          ],
          "areaServed": "Worldwide"
        }
      ]
    }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
